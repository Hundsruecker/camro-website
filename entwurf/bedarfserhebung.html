.box b{display:block;font-size:15px;margin-bottom:6px}

.defs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px 48px;margin:24px 0 36px;max-width:60em}
.defs h3{font-size:17px;font-weight:700;margin-bottom:4px}
.defs p{font-size:15px;color:var(--text2)}
.gaps{list-style:none;margin:0 0 48px;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:32px}

.gaps .m i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--pine)}
.gaps span{display:block;margin-top:12px;font-size:17px;font-weight:600}
.gaps small{display:block;font-size:15px;color:var(--muted)}
.prio{display:flex;flex-wrap:wrap;gap:40px 72px;align-items:flex-start}
.prio .figs{flex:1 1 280px;display:flex;flex-direction:column;gap:28px}
.prio .figs b{display:block;font-size:clamp(64px,8vw,104px);font-weight:800;line-height:.9;letter-spacing:-.04em;color:var(--raps)}
.prio .figs span{display:block;margin-top:8px;font-size:18px;color:var(--white);font-weight:600}
.prio .figs small{display:block;font-size:15px;color:var(--on-ink)}
.prio .chart{flex:1.3 1 380px;min-width:0}
.prio .chart h3{color:var(--white)}
.prio .bars .fill{background:var(--raps)}
.prio .bars .track::before{background:var(--ink-line)}
.prio .bars li{color:var(--white)}
.band-ink .sec-title{color:var(--white)}
.band-ink .sec-sub{color:var(--on-ink)}
.tbox table{min-width:640px}
</style>

      var w = Math.max(0, Math.min(100, it[1] / max * 100));
      var shown = it[2] != null ? it[2] : CAMRO.fmt(it[1]);
      return '<li><span class="lab">' + e(it[0]) + '</span><span class="track" aria-hidden="true"><span class="fill' + (opts.hi === i ? " hi" : "") + '" style="width:' + w.toFixed(1) + '%"></span></span><span class="val">' + e(shown) + '</span></li>';
    }).join("") + '</ul>';
  }
  function chart(title, items, max, opts) { return '<div class="chart"><h3>' + e(title) + '</h3>' + bars(items, max, opts) + '</div>'; }

    h += '<section class="band-white"><div class="wrap sec">' + head(d.gapsT) + '<ul class="gaps">' + d.gaps.map(function (g) {

  var dict = {}; ["de", "en", "ro"].forEach(function (l) { dict[l] = { pageTitle: D[l].pageTitle }; });
