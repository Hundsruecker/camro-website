<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Für Gemeinden – CAMRO</title>
<link rel="icon" href="logo/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="logo/apple-touch-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/camro.css">
<style>
.areas{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:0 48px}
.areas li{padding:18px 0;border-top:1px solid var(--line);font-size:18px;font-weight:600}
.cofin{display:flex;flex-wrap:wrap;gap:24px 64px;align-items:flex-start}
.cofin h2{flex:1 1 300px;font-size:clamp(28px,3.2vw,40px);font-weight:800;line-height:1.08;letter-spacing:-.02em}
.cofin p{flex:2 1 420px;font-size:19px;line-height:1.6}
.ask{display:flex;flex-wrap:wrap;gap:24px 48px;align-items:center;justify-content:space-between;background:var(--white);border-radius:10px;padding:clamp(28px,4vw,48px)}
.ask h2{font-size:30px;font-weight:800;letter-spacing:-.015em;margin-bottom:10px}
.ask p{max-width:34em}
</style>
</head>
<body data-page="gemeinden.html">
<div id="site-header"></div>

<main id="main">
  <section class="wrap page-head">
    <h1 data-i18n="h1"></h1>
    <p class="lead" data-i18n="lead"></p>
    <div class="ctas">
      <a class="btn btn-dark" href="#anfrage" data-i18n="ctaAsk"></a>
      <a class="btn btn-line" href="kriterien.html" data-i18n="ctaCrit"></a>
    </div>
  </section>

  <section class="wrap sec">
    <h2 class="sec-title" data-i18n="whoTitle"></h2>
    <div class="split">
      <div><h3 class="list-head" style="color:var(--pine)" data-i18n="whoYes"></h3><ul class="ticks" id="whoYes"></ul></div>
      <div><h3 class="list-head" data-i18n="whoNo"></h3><ul class="dashes" id="whoNo"></ul></div>
    </div>
    <p class="small" style="margin-top:20px;max-width:44em" data-i18n="whoNote"></p>
  </section>

  <section class="band-white">
    <div class="wrap sec split">
      <div>
        <h2 class="sec-title" data-i18n="preTitle"></h2>
        <ul class="ticks" id="pre"></ul>
      </div>
      <div>
        <h2 class="sec-title" data-i18n="minTitle"></h2>
        <h3 class="list-head" data-i18n="minHead"></h3>
        <ul class="ticks" id="min"></ul>
        <p style="margin-top:20px"><a class="textlink" href="kriterien.html" data-i18n="minLink"></a></p>
      </div>
    </div>
  </section>

  <section class="wrap sec">
    <h2 class="sec-title" data-i18n="areasTitle"></h2>
    <p class="lead" style="margin-bottom:32px" data-i18n="areasLead"></p>
    <ul class="areas" id="areas"></ul>
  </section>

  <section class="band-pine">
    <div class="wrap sec cofin">
      <h2 data-i18n="cofinTitle"></h2>
      <p data-i18n="cofinText"></p>
    </div>
  </section>

  <section class="wrap sec">
    <h2 class="sec-title" style="margin-bottom:40px" data-i18n="procTitle"></h2>
    <ol class="steps" id="proc"></ol>
    <p style="margin-top:32px"><a class="textlink" href="kriterien.html#verfahren" data-i18n="procLink"></a></p>
  </section>

  <section class="wrap" id="anfrage" style="padding-bottom:96px">
    <div class="ask">
      <div>
        <h2 data-i18n="askTitle"></h2>
        <p data-i18n="askText"></p>
      </div>
      <a class="btn btn-dark js-form" href="https://app.camro.ro/anfrage-stellen/?lang=de" data-i18n="askBtn"></a>
    </div>
  </section>
</main>

<div id="site-footer"></div>
<script src="assets/camro.js"></script>

</html>
