<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kriterien &amp; Transparenz – CAMRO</title>
<link rel="icon" href="logo/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="logo/apple-touch-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/camro.css">
<style>
.trial{display:flex;flex-wrap:wrap;gap:32px 72px;align-items:flex-start}
.trial h2{flex:1 1 300px;font-size:clamp(28px,3.4vw,44px);font-weight:800;line-height:1.08;letter-spacing:-.02em;color:var(--white)}
.trial .body{flex:1.4 1 420px;min-width:0}
.trial .body > p:first-child{font-size:18px;color:var(--white);margin-bottom:14px}
.trial ul{list-style:none;margin:0;padding:0}
.trial li{padding:14px 0;border-top:1px solid var(--ink-line);font-size:17px;color:var(--on-ink)}
.trial .after{margin-top:20px;font-size:17px;color:var(--white);font-weight:600}
.principles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:32px}
.principles div{padding-top:18px;border-top:3px solid var(--ink)}
.principles h3{font-size:20px;font-weight:700;margin-bottom:8px}
.principles p{color:var(--text2)}
</style>
</head>
<body data-page="kriterien.html">
<div id="site-header"></div>

<main id="main">
  <section class="wrap page-head">
    <h1 data-i18n="h1"></h1>
    <p class="lead" data-i18n="lead"></p>
    <ul class="jump">
      <li><a href="#verfahren" data-i18n="j1"></a></li>
      <li><a href="#probephase" data-i18n="j2"></a></li>
      <li><a href="#kriterien" data-i18n="j3"></a></li>
      <li><a href="#bewertung" data-i18n="j4"></a></li>
      <li><a href="#grundprinzipien" data-i18n="j5"></a></li>
    </ul>
  </section>

  <section class="wrap sec" id="verfahren">
    <h2 class="sec-title" style="margin-bottom:36px" data-i18n="procTitle"></h2>
    <ol class="vsteps" id="proc"></ol>
  </section>

  <section class="band-ink" id="probephase">
    <div class="wrap sec trial">
      <h2 data-i18n="trialTitle"></h2>
      <div class="body">
        <p data-i18n="trialLead"></p>
        <ul id="trial"></ul>
        <p class="after" data-i18n="trialAfter"></p>
      </div>
    </div>
  </section>

  <section class="wrap sec" id="kriterien">
    <h2 class="sec-title" style="margin-bottom:32px" data-i18n="critTitle"></h2>
    <div class="split">
      <div><h3 class="list-head" style="color:var(--pine)" data-i18n="minTitle"></h3><ul class="ticks" id="min"></ul></div>
      <div><h3 class="list-head" data-i18n="exTitle"></h3><ul class="dashes" id="ex"></ul></div>
    </div>
  </section>

  <section class="band-white" id="bewertung">
    <div class="wrap sec">
      <h2 class="sec-title" style="margin-bottom:32px" data-i18n="evalTitle"></h2>
      <div class="split">
        <div><h3 class="list-head" style="color:var(--pine)" data-i18n="evalHead"></h3><ul class="ticks" id="eval"></ul></div>
        <div><h3 class="list-head" data-i18n="endHead"></h3><ul class="dashes" id="end"></ul></div>
      </div>
      <p class="small" style="margin-top:20px;max-width:44em" data-i18n="endNote"></p>
    </div>
  </section>

  <section class="wrap sec" id="grundprinzipien" style="padding-bottom:96px">
    <h2 class="sec-title" style="margin-bottom:32px" data-i18n="prinTitle"></h2>
    <div class="principles" id="prin"></div>
  </section>
</main>

<div id="site-footer"></div>
<script src="assets/camro.js"></script>
