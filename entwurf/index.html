<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAMRO</title>
<link rel="icon" href="logo/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="logo/apple-touch-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/camro.css">
<style>
.hero{padding-top:clamp(40px,6vw,88px);padding-bottom:72px;display:flex;flex-wrap:wrap;gap:56px;align-items:flex-start}
.hero-text{flex:1 1 380px;min-width:0;max-width:520px;padding-top:8px}
.hero h1{margin:0 0 28px;font-weight:800;font-size:clamp(40px,5.2vw,68px);line-height:1.02;letter-spacing:-.025em}
.hero .mapbox{flex:1 1 560px;min-width:0}
.facts{margin:0;display:flex;flex-direction:column}
.facts > div{padding:20px 0;border-top:1px solid var(--line)}
.facts dt{font-weight:700;font-size:18px;margin-bottom:6px}
.facts dd{margin:0;color:var(--text2);font-size:16px;line-height:1.55}
.survey .wrap{padding-top:80px;padding-bottom:80px;display:flex;flex-wrap:wrap;gap:48px 80px;align-items:flex-end}
.survey-text{flex:1 1 440px;min-width:0;max-width:600px}
.survey-text h2{margin:0 0 20px;font-size:clamp(30px,3.6vw,46px);font-weight:800;line-height:1.06;letter-spacing:-.02em}
.survey-text p{font-size:18px;line-height:1.6}
.survey a.textlink{display:inline-block;margin-top:26px;color:var(--white);text-decoration-color:var(--raps)}
.survey figure{flex:1 1 380px;min-width:0;margin:0}
.big{display:flex;align-items:baseline;gap:14px}
.big b{font-size:clamp(64px,8vw,104px);font-weight:800;line-height:.9;letter-spacing:-.04em;color:var(--raps)}
.big span{font-size:22px;font-weight:600;color:var(--white)}
.meter{margin-top:22px;height:14px;border-radius:3px;background:#3A4566;overflow:hidden}
.meter i{display:block;width:88.6%;height:100%;background:var(--raps)}
.survey figcaption{margin-top:14px;font-size:16px;line-height:1.5;color:var(--on-ink)}
.kpis{flex:1 1 380px;min-width:0;list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.kpis li{border-top:2px solid var(--ink-line);padding-top:14px}
.kpis b{display:block;font-size:clamp(34px,4.4vw,56px);font-weight:800;line-height:1;letter-spacing:-.03em;color:var(--white)}
.kpis li:last-child{border-top-color:var(--raps)}
.kpis li:last-child b{color:var(--raps)}
.kpis span{display:block;margin-top:8px;font-size:15px;color:var(--on-ink)}
.phases{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:32px}
.phases li{flex:1 1 280px;min-width:0}
.phases .pb{height:8px;border-radius:2px;background:var(--line)}
.phases li:nth-child(1) .pb{background:var(--pine)}
.phases li:nth-child(2) .pb{background:repeating-linear-gradient(90deg,var(--pine) 0 10px,transparent 10px 16px)}
.phases .when{font-size:14px;margin-top:16px;color:var(--muted)}
.phases .when b{color:var(--ink);margin-right:8px}
.phases h3{margin:6px 0 8px;font-size:20px;font-weight:700}
.phases p.t{font-size:16px;line-height:1.6;color:var(--text2)}
.aud{padding-bottom:96px;display:flex;flex-wrap:wrap;gap:24px}
.aud > div{flex:1 1 380px;min-width:0;border-radius:10px;padding:clamp(28px,4vw,48px)}
.aud h2{margin:0 0 14px;font-size:30px;font-weight:800;letter-spacing:-.015em}
.aud p{font-size:17px;line-height:1.6;max-width:30em}
.aud .btn{margin-top:28px;padding:0 22px}
.aud-gem{background:var(--pine);color:var(--white)} .aud-gem p{color:var(--pine-soft)}
.aud-sup{background:var(--raps);color:var(--ink)}
</style>
</head>
<body data-page="index.html">
<div id="site-header"></div>

<main id="main">
  <section class="wrap hero">
    <div class="hero-text">
      <h1 data-i18n="heroTitle"></h1>
      <p class="lead" data-i18n="heroText"></p>
      <div class="ctas">
        <a class="btn btn-dark" href="gemeinden.html" data-i18n="ctaGem"></a>
        <a class="btn btn-line" href="unterstuetzer.html" data-i18n="ctaSup"></a>
      </div>
    </div>
    <div class="mapbox" id="karte">
      <h2 data-i18n="mapTitle"></h2>
      <p class="hint" data-i18n="mapHint"></p>
      <div class="tgrid" id="grid"></div>
      <div class="mapfoot">
        <ul class="legend" id="legend"></ul>
        <div class="panel" id="panel" aria-live="polite"></div>
      </div>
      <p class="note"><span data-i18n="mapNote"></span> <span data-i18n="mapDraft"></span></p>
    </div>
  </section>

  <section class="wrap sec split" style="border-top:1px solid var(--line)">
    <div style="max-width:620px">
      <h2 class="sec-title" data-i18n="aboutTitle"></h2>
      <p style="font-size:18px;line-height:1.65" data-i18n="aboutText"></p>
    </div>
    <dl class="facts" id="facts"></dl>
  </section>

  <section class="survey band-ink">
    <div class="wrap">
      <div class="survey-text">
        <h2 data-i18n="surveyTitle"></h2>
        <p data-i18n="surveyText"></p>
        <a class="textlink" href="bedarfserhebung.html" data-i18n="surveyLink"></a>
      </div>
      <figure>
        <div class="big"><b>93</b><span data-i18n="surveyOf"></span></div>
        <div class="meter" role="img" data-i18n-aria="surveyStat"><i></i></div>
        <figcaption data-i18n="surveyStat"></figcaption>
      </figure>
    </div>
  </section>

  <section class="wrap sec">
    <h2 class="sec-title" style="margin-bottom:40px" data-i18n="stepsTitle"></h2>
    <ol class="steps" id="steps"></ol>
  </section>

  <section class="band-white">
    <div class="wrap sec">
      <h2 class="sec-title" style="max-width:16em;margin-bottom:40px" data-i18n="critTitle"></h2>
      <div class="split">
        <div><h3 class="list-head" style="color:var(--pine)" data-i18n="isHead"></h3><ul class="ticks" id="isList"></ul></div>
        <div><h3 class="list-head" data-i18n="notHead"></h3><ul class="dashes" id="notList"></ul></div>
      </div>
      <p style="margin-top:32px"><a class="textlink" href="kriterien.html" data-i18n="critLink"></a></p>
    </div>
  </section>

  <section class="wrap sec">
    <div style="max-width:640px;margin-bottom:44px">
      <h2 class="sec-title" style="margin-bottom:16px" data-i18n="stateTitle"></h2>
      <p style="font-size:18px" data-i18n="stateText"></p>
    </div>
    <ol class="phases" id="phases"></ol>
  </section>

  <section class="wrap aud">
    <div class="aud-gem">
      <h2 data-i18n="audGemTitle"></h2>
      <p data-i18n="audGemText"></p>
      <a class="btn btn-white" href="gemeinden.html" data-i18n="audGemLink"></a>
    </div>
    <div class="aud-sup">
      <h2 data-i18n="audSupTitle"></h2>
      <p data-i18n="audSupText"></p>
      <a class="btn btn-dark" href="unterstuetzer.html" data-i18n="audSupLink"></a>
    </div>
  </section>
</main>

<div id="site-footer"></div>
<script src="assets/camro.js"></script>
